# Docker Compose v2 syntax (version field is optional and deprecated)
services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:16-alpine
    # Use specific version tag for stability
    # Update to postgres:17-alpine when available and tested
    container_name: gemilike-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gemilike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-gemilike_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemilike}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gemilike-dev-network

  # Next.js Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: gemilike-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-gemilike}:${POSTGRES_PASSWORD:-dev-password}@postgres:5432/${POSTGRES_DB:-gemilike_dev}?schema=public
      
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-key-change-in-production}
      
      # Email Configuration (can use MailHog for development)
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@gemilike.de}
      
      # Admin Email
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./public/uploads:/app/public/uploads
      - ./public/invoices:/app/public/invoices
      # Persist gemstone analysis images (if stored locally)
      - ./public/gemstone-analyses:/app/public/gemstone-analyses
      # Mount data directory for color charts
      - ./data:/app/data
    networks:
      - gemilike-dev-network
    command: npm run dev

  # MailHog for email testing in development
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gemilike-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - gemilike-dev-network

volumes:
  postgres_dev_data:
    driver: local

networks:
  gemilike-dev-network:
    driver: bridge

