# Docker Compose v2 syntax (version field is optional and deprecated)
services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    # PostgreSQL 17 is the latest stable version
    container_name: gemilike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gemilike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-gemilike}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Use different port if 5432 is already in use
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gemilike} -d ${POSTGRES_DB:-gemilike}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gemilike-network
    # Resource limits for production (optimized)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        # Dummy for build only; runtime uses DATABASE_URL from environment below
        - DATABASE_URL=postgresql://build:build@localhost:5432/build
    container_name: gemilike-app
    restart: unless-stopped
    environment:
      # Node Environment
      NODE_ENV: production
      PORT: 3000
      
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-gemilike}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-gemilike}?schema=public
      
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@gemilike.de}
      
      # Admin Email
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      
      # Analytics (optional)
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      # Use different port if 3000 is already in use (e.g., by dev server)
      # Change APP_PORT in .env if needed
      - "${APP_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persist uploaded files
      - ./public/uploads:/app/public/uploads
      # Persist generated invoices
      - ./public/invoices:/app/public/invoices
      # Persist gemstone analysis images (if stored locally)
      - ./public/gemstone-analyses:/app/public/gemstone-analyses
      # Persist color chart data (if needed)
      - ./data:/app/data:ro
      # Persist color chart exports (if stored locally)
      - ./public/color-charts:/app/public/color-charts
    networks:
      - gemilike-network
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        until nc -z postgres 5432 2>/dev/null || timeout 1 bash -c 'cat < /dev/null > /dev/tcp/postgres/5432' 2>/dev/null; do
          echo 'Database is unavailable - waiting...'
          sleep 2
        done &&
        echo 'Database is ready!' &&
        echo 'Running migrations...' &&
        npx prisma migrate deploy &&
        npx prisma generate &&
        echo 'Verifying Service Worker...' &&
        test -f public/sw.js && echo 'Service Worker found' || echo 'Warning: Service Worker not found' &&
        echo 'Starting application...' &&
        node server.js
      "
    healthcheck:
      # Check if the application is responding
      # Fallback to curl if wget is not available
      # Also check database connectivity
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health 2>/dev/null || curl -f http://localhost:3000/api/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits for production (optimized)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
          pids: 200
        reservations:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

volumes:
  postgres_data:
    driver: local

networks:
  gemilike-network:
    driver: bridge

