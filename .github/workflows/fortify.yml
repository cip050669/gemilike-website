name: Fortify Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  # Prefer client credentials; fall back to username/password if required
  FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
  FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
  FOD_USER: ${{ secrets.FOD_USER }}
  FOD_PASSWORD: ${{ secrets.FOD_PASSWORD }}

jobs:
  fortify-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
      - uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run Fortify ScanCentral Client
      env:
        FOD_CLIENT_ID: ${{ env.FOD_CLIENT_ID }}
        FOD_CLIENT_SECRET: ${{ env.FOD_CLIENT_SECRET }}
        FOD_USER: ${{ env.FOD_USER }}
        FOD_PASSWORD: ${{ env.FOD_PASSWORD }}
      run: |
        if [[ -z "$FOD_CLIENT_ID" && -z "$FOD_USER" ]]; then
          echo "FOD env variables missing." >&2
          exit 1
        fi
        echo "Simulating Fortify CLI call..."
        # Example:
        # scancentral submit -upload ... --fod-client-id "$FOD_CLIENT_ID" --fod-client-secret "$FOD_CLIENT_SECRET"

