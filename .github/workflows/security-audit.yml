# Security Audit Workflow
# Runs npm audit and checks for known vulnerabilities
name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  security-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run npm audit (JSON output)
        run: npm audit --json > npm-audit.json 2>/dev/null || true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 30
      
      - name: Comment PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let audit = { metadata: { vulnerabilities: {} } };
            try {
              if (fs.existsSync('npm-audit.json')) {
                const raw = fs.readFileSync('npm-audit.json', 'utf8');
                if (raw && raw.trim()) audit = JSON.parse(raw);
              }
            } catch (e) { /* use defaults */ }
            const vuln = audit.metadata?.vulnerabilities || {};
            const total = Number(vuln.total) || 0;
            if (total > 0) {
              const body = `## 🔒 Security Audit Results
              **Total vulnerabilities found:** ${total}
              - Critical: ${vuln.critical || 0}
              - High: ${vuln.high || 0}
              - Moderate: ${vuln.moderate || 0}
              - Low: ${vuln.low || 0}
              Please review and update dependencies as needed.`;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

