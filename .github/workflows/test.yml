# Unit tests, coverage report, and production build
name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values for Prisma/Next at generate & build time (no live DB)
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gemilike_ci?schema=public
  NEXTAUTH_SECRET: ci-nextauth-secret-not-for-production
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  unit:
    name: Jest + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Jest with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Production build
        run: npm run build
